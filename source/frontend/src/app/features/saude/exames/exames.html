<section class="saude-exames">
  <header>
    <p>Saude ocupacional</p>
    <h1>Exames ocupacionais</h1>
  </header>

  <form [formGroup]="form" (ngSubmit)="create()" class="panel">
    <label>
      <span>Codigo</span>
      <input formControlName="code" />
    </label>
    <label>
      <span>Nome</span>
      <input formControlName="name" />
    </label>
    <label>
      <span>Tipo</span>
      <select formControlName="examType">
        <option value="CLINICO">Clinico</option>
        <option value="LABORATORIAL">Laboratorial</option>
        <option value="COMPLEMENTAR">Complementar</option>
        <option value="IMAGEM">Imagem</option>
      </select>
    </label>
    <label>
      <span>Periodicidade</span>
      <input type="number" min="1" formControlName="periodicityMonths" />
    </label>
    <label class="check">
      <input type="checkbox" formControlName="isMandatoryAdmission" />
      <span>Admissional</span>
    </label>
    <label class="check">
      <input type="checkbox" formControlName="isMandatoryPeriodic" />
      <span>Periodico</span>
    </label>
    <button type="submit" [disabled]="saving">Salvar</button>
  </form>

  <section class="panel">
    <button type="button" (click)="load()" [disabled]="loading">Atualizar</button>
    <table>
      <thead>
        <tr>
          <th>Codigo</th>
          <th>Nome</th>
          <th>Tipo</th>
          <th>Meses</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let exam of exams">
          <td>{{ exam.code }}</td>
          <td>{{ exam.name }}</td>
          <td>{{ exam.examType }}</td>
          <td>{{ exam.periodicityMonths || '-' }}</td>
          <td>{{ exam.active ? 'Ativo' : 'Inativo' }}</td>
        </tr>
      </tbody>
    </table>
  </section>
</section>
