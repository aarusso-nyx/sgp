<section class="appointments">
  <header>
    <h1>Minhas nomeacoes</h1>
  </header>

  <article *ngFor="let appointment of appointments">
    <div>
      <strong>{{ appointment.concurso }}</strong>
      <span>{{ appointment.status }}</span>
    </div>
    <dl>
      <dt>Ato</dt>
      <dd>{{ appointment.ato }}</dd>
      <dt>Publicacao</dt>
      <dd>{{ appointment.publishedAt }}</dd>
      <dt>Prazo</dt>
      <dd>{{ appointment.comparecimentoUntil }}</dd>
    </dl>
    <p>{{ appointment.instructions }}</p>
  </article>
</section>
