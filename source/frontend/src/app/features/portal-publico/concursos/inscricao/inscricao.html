<section class="public-application">
  <div class="lgpd-modal" *ngIf="consentOpen">
    <div role="dialog" aria-modal="true" aria-labelledby="lgpd-title">
      <h2 id="lgpd-title">Consentimento LGPD</h2>
      <p>
        Autorizo o tratamento dos dados informados para inscricao no concurso, validacao de
        requisitos, analise de isencao e geracao de cobranca.
      </p>
      <p>Versao do termo: {{ lgpdConsentVersion }}</p>
      <button type="button" (click)="acceptConsent()">Aceitar</button>
    </div>
  </div>

  <header>
    <h1>Inscricao em concurso</h1>
    <nav aria-label="Etapas da inscricao">
      <button type="button" [class.active]="step === 'personal'">Dados</button>
      <button type="button" [class.active]="step === 'position'">Cargo</button>
      <button type="button" [class.active]="step === 'quota'">Cota</button>
      <button type="button" [class.active]="step === 'exemption'">Isencao</button>
      <button type="button" [class.active]="step === 'biometrics'">Biometria</button>
      <button type="button" [class.active]="step === 'confirm'">Confirmacao</button>
      <button type="button" [class.active]="step === 'payment'">Pagamento</button>
    </nav>
  </header>

  <form>
    <fieldset *ngIf="step === 'personal'">
      <label>CPF <input name="cpf" inputmode="numeric" [(ngModel)]="form.cpf" /></label>
      <label>Nome completo <input name="fullName" [(ngModel)]="form.fullName" /></label>
      <label>Nascimento <input name="birthDate" type="date" [(ngModel)]="form.birthDate" /></label>
      <label>Email <input name="email" type="email" [(ngModel)]="form.email" /></label>
      <label>Telefone <input name="phone" [(ngModel)]="form.phone" /></label>
      <label>Endereco <input name="street" [(ngModel)]="form.street" /></label>
      <label>Cidade <input name="city" [(ngModel)]="form.city" /></label>
      <label>UF <input name="state" maxlength="2" [(ngModel)]="form.state" /></label>
      <label>CEP <input name="postalCode" [(ngModel)]="form.postalCode" /></label>
    </fieldset>

    <fieldset *ngIf="step === 'position'">
      <label>Vaga <input name="vagaId" [(ngModel)]="form.vagaId" /></label>
      <label>Escolaridade <input name="education" [(ngModel)]="form.education" /></label>
      <label
        >Registro profissional
        <input name="professionalRegistry" [(ngModel)]="form.professionalRegistry"
      /></label>
    </fieldset>

    <fieldset *ngIf="step === 'quota'">
      <label>
        Autodeclaracao
        <select name="quota" [(ngModel)]="form.quota">
          <option value="">Ampla concorrencia</option>
          <option value="pcd">PCD</option>
          <option value="racial">Racial</option>
          <option value="indigenous">Indigena</option>
        </select>
      </label>
    </fieldset>

    <fieldset *ngIf="step === 'exemption'">
      <label>
        Isencao
        <select name="exemptionKind" [(ngModel)]="form.exemptionKind">
          <option value="NONE">Nao solicitar</option>
          <option value="CADUNICO">CadUnico</option>
          <option value="BONE_MARROW_DONOR">Doador de medula</option>
        </select>
      </label>
      <label>NIS <input name="nis" [(ngModel)]="form.nis" /></label>
      <label
        >Registro de doador <input name="donorRegistry" [(ngModel)]="form.donorRegistry"
      /></label>
      <label
        >Comprovante <input name="exemptionEvidence" [(ngModel)]="form.exemptionEvidence"
      /></label>
    </fieldset>

    <fieldset *ngIf="step === 'biometrics'">
      <label>
        <input name="biometricConsent" type="checkbox" [(ngModel)]="form.biometricConsent" />
        Confirmo consentimento especifico LGPD art. 11 versao {{ biometricConsentVersion }}
      </label>
      <label>Qualidade digital <meter min="0" max="1" [value]="form.fingerprintQuality"></meter></label>
      <label>Qualidade face <meter min="0" max="1" [value]="form.faceQuality"></meter></label>
      <button type="button" (click)="acceptBiometricConsent()">Aceitar termo biometrico</button>
      <button type="button" (click)="captureFingerprint()" [disabled]="!form.biometricConsent">
        Capturar digital
      </button>
      <button type="button" (click)="captureFace()" [disabled]="!form.biometricConsent">
        Capturar face
      </button>
    </fieldset>

    <fieldset *ngIf="step === 'confirm'">
      <label>
        <input name="lgpdConsent" type="checkbox" [(ngModel)]="form.lgpdConsent" />
        Confirmo consentimento LGPD versao {{ lgpdConsentVersion }}
      </label>
      <p>{{ form.fullName }} - CPF {{ form.cpf }}</p>
    </fieldset>

    <fieldset *ngIf="step === 'payment'">
      <label
        >QR PIX <textarea name="pixQrCode" readonly [(ngModel)]="payment.pixQrCode"></textarea>
      </label>
      <label
        >Codigo de barras <input name="boletoBarcode" readonly [(ngModel)]="payment.boletoBarcode"
      /></label>
    </fieldset>
  </form>

  <footer>
    <button type="button" (click)="previous()" [disabled]="step === 'personal'">Voltar</button>
    <button type="button" (click)="next()" [disabled]="step === 'payment'">Avancar</button>
  </footer>
</section>
