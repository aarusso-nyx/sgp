<section class="bank-accounts">
  <header>
    <div>
      <p>Recursos Humanos</p>
      <h1>Dados bancarios do servidor</h1>
    </div>
    <label>
      <span>Servidor</span>
      <input [(ngModel)]="employeeId" />
    </label>
    <button type="button" mat-stroked-button (click)="load()">Carregar</button>
  </header>

  <p *ngIf="message" role="status" class="message">{{ message }}</p>
  <p *ngIf="error" role="alert" class="error">{{ error }}</p>
  <p *ngIf="loading">Carregando...</p>

  <table aria-label="Contas bancarias">
    <thead>
      <tr>
        <th>Banco</th>
        <th>Agencia</th>
        <th>Conta</th>
        <th>Status</th>
        <th>Historico</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <td>{{ row.bankCode }}</td>
        <td>{{ row.agency }}</td>
        <td>{{ row.accountNumber }}</td>
        <td>{{ row.validationStatus }}</td>
        <td>{{ row.updatedAt }}</td>
        <td>
          <button type="button" mat-stroked-button (click)="revalidate(row)">
            Revalidar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
