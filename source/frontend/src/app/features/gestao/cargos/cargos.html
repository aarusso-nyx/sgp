<section class="cargos" aria-labelledby="cargos-title">
  <header class="cargos__header">
    <div>
      <p class="cargos__eyebrow">Gestao</p>
      <h1 id="cargos-title">Cargos</h1>
    </div>
    <button mat-flat-button color="primary" type="button" (click)="save()">
      <mat-icon>save</mat-icon>
      Salvar
    </button>
  </header>

  <p class="cargos__error" *ngIf="error" role="alert">{{ error }}</p>

  <div class="cargos__layout">
    <form class="cargos__form" [formGroup]="form" (ngSubmit)="save()">
      <mat-form-field appearance="outline">
        <mat-label>Codigo</mat-label>
        <input matInput formControlName="code" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Categoria</mat-label>
        <input matInput formControlName="category" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Regime juridico</mat-label>
        <input matInput formControlName="legalRegime" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Lei de criacao</mat-label>
        <input matInput formControlName="creationLaw" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Vagas</mat-label>
        <input matInput type="number" formControlName="vacanciesCount" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Faixa salarial</mat-label>
        <input matInput formControlName="salaryRangeId" list="salary-ranges" />
        <datalist id="salary-ranges">
          <option *ngFor="let range of salaryRanges" [value]="range.id">
            {{ range.code }} - {{ range.name }}
          </option>
        </datalist>
      </mat-form-field>
      <mat-form-field appearance="outline" class="cargos__description">
        <mat-label>Descricao</mat-label>
        <textarea matInput formControlName="description" rows="3"></textarea>
      </mat-form-field>
    </form>

    <div class="cargos__table" aria-label="Lista de cargos">
      <button
        mat-button
        type="button"
        *ngFor="let cargo of cargos"
        (click)="selectCargo(cargo)"
        [class.cargos__row--active]="cargo.id === selectedCargo?.id"
      >
        <span>{{ cargo.code }}</span>
        <strong>{{ cargo.name }}</strong>
        <small>{{ cargo.category }} · {{ cargo.salaryRangeCode || 'sem faixa' }}</small>
      </button>
    </div>
  </div>

  <section class="cargos__salary" aria-label="Tabela salarial">
    <h2>Tabela Salarial</h2>
    <table>
      <thead>
        <tr>
          <th>Classe</th>
          <th>Nivel</th>
          <th>Vencimento basico</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let level of salaryLevels">
          <td>{{ level.classNumber }}</td>
          <td>{{ level.levelNumber }}</td>
          <td>{{ level.baseSalary }}</td>
        </tr>
      </tbody>
    </table>
  </section>
</section>
