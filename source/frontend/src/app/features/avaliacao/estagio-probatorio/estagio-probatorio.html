<section class="probation" aria-labelledby="probation-title">
  <header>
    <p>Modulo Avaliacao</p>
    <h1 id="probation-title">Estagio probatorio</h1>
  </header>

  <p class="probation__message" *ngIf="message" role="status">{{ message }}</p>
  <p class="probation__error" *ngIf="error" role="alert">{{ error }}</p>

  <div class="probation__layout">
    <section>
      <h2>Servidores a avaliar</h2>
      <p *ngIf="loading">Carregando...</p>
      <table aria-label="Servidores em estagio probatorio">
        <thead>
          <tr>
            <th>Matricula</th>
            <th>Nome</th>
            <th>Completa em</th>
            <th>Dias</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let employee of employees" (click)="select(employee)">
            <td>{{ employee.matricula }}</td>
            <td>{{ employee.nome }}</td>
            <td>{{ employee.completaEm }}</td>
            <td>{{ employee.diasParaConclusao }}</td>
          </tr>
        </tbody>
      </table>
    </section>

    <form [formGroup]="evaluationForm" (ngSubmit)="submit()">
      <h2>Avaliacao parcial</h2>
      <label>
        <span>Servidor</span>
        <input formControlName="funcionarioId" />
      </label>
      <label>
        <span>Periodo inicio</span>
        <input type="date" formControlName="periodoInicio" />
      </label>
      <label>
        <span>Periodo fim</span>
        <input type="date" formControlName="periodoFim" />
      </label>
      <label>
        <span>Nota</span>
        <input type="number" min="0" max="10" step="0.01" formControlName="nota" />
      </label>
      <label>
        <span>Decisao</span>
        <select formControlName="decisao">
          <option value="pending">Pendente</option>
          <option value="approved">Aprovado</option>
          <option value="rejected">Reprovado</option>
          <option value="extended">Prorrogado</option>
        </select>
      </label>
      <label>
        <span>Avaliador</span>
        <input formControlName="avaliadorId" />
      </label>
      <label class="probation__wide">
        <span>Observacao</span>
        <textarea rows="3" formControlName="observacao"></textarea>
      </label>
      <button type="submit" mat-flat-button color="primary" [disabled]="saving">Registrar</button>
    </form>
  </div>
</section>
