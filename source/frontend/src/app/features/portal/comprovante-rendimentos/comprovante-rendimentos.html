<section class="yearly-income">
  <header>
    <p>Portal do servidor</p>
    <h1>Comprovante de rendimentos</h1>
  </header>

  <p class="yearly-income__error" *ngIf="error" role="alert">{{ error }}</p>

  <ol class="yearly-income__list">
    <li *ngFor="let item of files">
      <div>
        <span>Ano-base {{ item.yearBase }}</span>
        <strong>{{ money(item.taxableTotal) }}</strong>
      </div>
      <span>{{ money(item.exemptTotal) }} isentos</span>
      <span>{{ money(item.irrfTotal) }} IRRF</span>
      <button type="button" (click)="download(item)">Baixar PDF</button>
    </li>
    <li *ngIf="files.length === 0">
      <span>Nenhum comprovante disponivel.</span>
    </li>
  </ol>
</section>
