name: Setup Stynx local npm packages
description: Build the Stynx sibling package tarballs expected by SGP file dependencies.

inputs:
  repository:
    description: GitHub repository that owns the Stynx framework source.
    required: false
    default: aarusso-nyx/stynx
  ref:
    description: Stynx git ref to package for SGP CI.
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Checkout Stynx
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        path: .ci/stynx-source

    - name: Build Stynx local package tarballs
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$GITHUB_WORKSPACE/../stynx"
        mkdir -p "$GITHUB_WORKSPACE/../stynx"
        cp -a "$GITHUB_WORKSPACE/.ci/stynx-source/." "$GITHUB_WORKSPACE/../stynx/"
        cd "$GITHUB_WORKSPACE/../stynx"
        corepack enable
        pnpm install --frozen-lockfile
        pnpm turbo run build --filter='./packages/*' --filter='./packages-web/*'
        rm -rf .release/local-npm
        mkdir -p .release/local-npm

        for manifest in packages/*/package.json packages-web/*/package.json; do
          package_dir="$(dirname "$manifest")"
          (cd "$package_dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/../stynx/.release/local-npm")
        done

        test -f .release/local-npm/stynx-tenancy-1.0.0.tgz
        test -f .release/local-npm/stynx-web-angular-1.0.0.tgz
