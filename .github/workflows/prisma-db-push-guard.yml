name: Prisma DB Push Guard

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Stynx local packages
        uses: ./.github/actions/setup-stynx-local-npm
        with:
          ref: ${{ vars.STYNX_REF || 'main' }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Check Prisma DB push guard
        run: npm run db:push:guard
