name: Deploy (dev)

# Triggered after Workspace CI succeeds on main. AWS is the only automated
# provision target. This workflow keeps stage in dry-run/plan mode until the
# owner explicitly enables apply; artifact rollout remains a separate flow.

on:
  workflow_run:
    workflows: ['Workspace CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Plan stage stack (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci

      - name: Install CDK dependencies
        run: npm --prefix infra/aws/cdk ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: sgp-deploy-dev-${{ github.run_id }}

      - name: Plan stage deployment
        run: |
          npm --prefix infra/aws/cdk run synth:stage -- -c hostedZoneId=${{ vars.ROUTE53_HOSTED_ZONE_ID }}
          npm run deploy -- --mode provision --target stage --stack all --dry-run

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dev-plan
          path: |
            cdk.out
            *.tfplan
          if-no-files-found: ignore

      - name: Attest deployment plan provenance
        if: always()
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'infra/aws/cdk/cdk.out/*.template.json'
