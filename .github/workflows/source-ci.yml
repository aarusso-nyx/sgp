name: Workspace CI

on:
  pull_request:
    paths:
      - '.github/workflows/source-ci.yml'
      - '.devai/**'
      - '.gitignore'
      - '.node-version'
      - '.nvmrc'
      - '.prettierrc.json'
      - '.editorconfig'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'stryker.conf.cjs'
      - 'tsconfig.json'
      - 'backend/**'
      - 'database/**'
      - 'docs/eng/**'
      - 'docs/gov/**'
      - 'docs/leg/rev-eng/deprecation-status.md'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/source-ci.yml'
      - '.devai/**'
      - '.gitignore'
      - '.node-version'
      - '.nvmrc'
      - '.prettierrc.json'
      - '.editorconfig'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'stryker.conf.cjs'
      - 'tsconfig.json'
      - 'backend/**'
      - 'database/**'
      - 'docs/eng/**'
      - 'docs/gov/**'
      - 'docs/leg/rev-eng/deprecation-status.md'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  source-gates:
    name: Workspace gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sgp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sgp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sgp_ci
      SGP_DB_ALIGNMENT_PHASE: full_closure
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks scans the full pull-request commit range below.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit message policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" | npx commitlint
          else
            npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --git-log-args=--no-merges
          fi

      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

      - name: Lint check
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Type contract tests
        run: npm run test:types

      - name: Circular dependency check
        run: npm run check:circular:backend && npm run check:circular:frontend

      - name: Module graph check
        run: |
          npm run check:depcruise:backend
          npm run check:depcruise:frontend

      - name: Duplicate code budget
        run: npm run check:duplication

      - name: Frontend OpenAPI client drift gate
        run: |
          npm run api:client:generate
          npm --workspace frontend exec -- prettier --write --ignore-unknown src/app/core/api/generated portal/src/app/core/api/generated
          git diff --exit-code -- frontend/src/app/core/api/generated frontend/portal/src/app/core/api/generated docs/eng/api/openapi.json docs/eng/api/openapi-portal.json

      - name: API route alignment
        run: npm run api:alignment:check -- --json

      - name: OpenAPI endpoint coverage report
        run: npm run audit:openapi-coverage

      - name: DB alignment
        run: npm run db:alignment:check -- --json

      - name: Runtime health JSON
        run: npm run health:json

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package build artefacts for attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p build-artefacts
          tar -czf build-artefacts/sgp-admin-dist.tar.gz -C frontend/dist . 2>/dev/null || true
          tar -czf build-artefacts/sgp-backend-dist.tar.gz -C backend/dist . 2>/dev/null || true
          ls -lh build-artefacts/

      - name: Generate SLSA build provenance attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build-artefacts/*.tar.gz'

      - name: ROADMAP auto-block check
        run: npm run roadmap:check

      - name: Governance validation
        run: npm run governance:check

      - name: Upload normal CI and DEVAI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ci-evidence-${{ github.run_id }}
          path: |
            .devai/state/evidence-chain.json
            .devai/state/inventory
            .devai/state/scorecards
            .devai/state/sensor-readings
            backend/coverage
            frontend/coverage
            docs/gov/evidence/sbom.cdx.json
          if-no-files-found: warn
