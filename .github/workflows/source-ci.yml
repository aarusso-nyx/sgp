name: Workspace CI

on:
  pull_request:
    paths:
      - '.github/workflows/source-ci.yml'
      - 'devai.config.json'
      - '.gitignore'
      - '.node-version'
      - '.nvmrc'
      - '.prettierrc.json'
      - '.editorconfig'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'backend/**'
      - 'database/**'
      - 'docs/eng/**'
      - 'docs/gov/**'
      - 'docs/leg/rev-eng/deprecation-status.md'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/source-ci.yml'
      - 'devai.config.json'
      - '.gitignore'
      - '.node-version'
      - '.nvmrc'
      - '.prettierrc.json'
      - '.editorconfig'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'backend/**'
      - 'database/**'
      - 'docs/eng/**'
      - 'docs/gov/**'
      - 'docs/leg/rev-eng/deprecation-status.md'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/**'
      - 'tests/**'

jobs:
  source-gates:
    name: Workspace gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sgp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sgp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sgp_ci
      SGP_DB_ALIGNMENT_PHASE: full_closure
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: API route alignment
        run: npm run api:alignment:check -- --json

      - name: DB alignment
        run: npm run db:alignment:check -- --json

      - name: Runtime health JSON
        run: npm run health:json

      - name: Unit tests
        run: npm run test:unit

      - name: Integration smoke
        run: npm run test:int

      - name: Backend e2e
        run: npm --workspace backend run test:e2e -- --runInBand

      - name: Build
        run: npm run build

      - name: Backend coverage
        run: npm --workspace backend run test:cov -- --runInBand

      - name: Governance validation
        run: npm run governance:check

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
