name: CDK Diff

on:
  pull_request:
    paths:
      - '.github/workflows/cdk-diff.yml'
      - 'infra/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  cdk-diff:
    name: CDK diff stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'sa-east-1' }}
      ROUTE53_HOSTED_ZONE_ID: ${{ vars.ROUTE53_HOSTED_ZONE_ID || 'ZSGPPLACEHOLDER' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/aws/cdk/package-lock.json

      - name: Install CDK dependencies
        run: npm --prefix infra/aws/cdk ci

      - name: Configure AWS read-only credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CDK_DIFF_READONLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK synth stage
        run: npm --prefix infra/aws/cdk run synth -- -c target=stage

      - name: CDK diff stage
        id: cdk_diff
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix infra/aws/cdk run diff -- -c target=stage --no-color 2>&1 | tee cdk-diff-stage.txt

      - name: Comment CDK diff
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- sgp-cdk-diff-stage -->';
            const raw = fs.readFileSync('cdk-diff-stage.txt', 'utf8').trim();
            const body = `${marker}
            ### CDK Diff: stage

            \`\`\`text
            ${raw.slice(0, 60000) || 'No diff output.'}
            \`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const previous = comments.data.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail when CDK diff failed
        if: steps.cdk_diff.outcome == 'failure'
        run: exit 1
