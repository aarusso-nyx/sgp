name: DB Alignment

on:
  pull_request:
    paths:
      - '.github/workflows/db-alignment.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/**'
      - 'database/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/eng/**'
      - 'docs/leg/rev-eng/**'
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/db-alignment.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/**'
      - 'database/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/eng/**'
      - 'docs/leg/rev-eng/**'

jobs:
  alignment-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SGP_DB_ALIGNMENT_PHASE: full_closure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci

      - name: Run API alignment sync/check (JSON)
        run: |
          set -euo pipefail
          npm run api:alignment:sync
          set +e
          npm run --silent api:alignment:check -- --json > api-alignment-report.json
          status=$?
          set -e

          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('api-alignment-report.json', 'utf8'));
          const findings = Array.isArray(report.findings) ? report.findings : [];
          const errors = findings.filter((item) => item.level === 'error');
          const oks = findings.filter((item) => item.level !== 'error');

          let summary = '';
          summary += '## API Alignment Gate\n';
          summary += `- Result: **${report.ok ? 'PASSED' : 'FAILED'}**\n`;
          summary += `- Checks: ${findings.length} (${oks.length} ok, ${errors.length} error)\n\n`;
          summary += '### Findings\n';
          for (const finding of findings) {
            summary += `- [${String(finding.level || 'unknown').toUpperCase()}] ${finding.message}\n`;
            if (finding.level === 'error') {
              console.log(`::error title=API alignment gate::${finding.message}`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

          if (!report.ok) {
            process.exit(1);
          }
          NODE

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Run DB alignment gate (JSON)
        run: |
          set -euo pipefail
          set +e
          npm run --silent db:alignment:check -- --json > db-alignment-report.json
          status=$?
          set -e

          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('db-alignment-report.json', 'utf8'));
          const findings = Array.isArray(report.findings) ? report.findings : [];
          const errors = findings.filter((item) => item.level === 'error');
          const oks = findings.filter((item) => item.level !== 'error');

          let summary = '';
          summary += '## DB Alignment Gate\n';
          summary += `- Phase: \`${report.phase}\`\n`;
          summary += `- Result: **${report.ok ? 'PASSED' : 'FAILED'}**\n`;
          summary += `- Checks: ${findings.length} (${oks.length} ok, ${errors.length} error)\n\n`;
          summary += '### Findings\n';
          for (const finding of findings) {
            summary += `- [${String(finding.level || 'unknown').toUpperCase()}] ${finding.message}\n`;
            if (finding.level === 'error') {
              console.log(`::error title=DB alignment gate::${finding.message}`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

          if (!report.ok) {
            process.exit(1);
          }
          NODE

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Upload API alignment report
        uses: actions/upload-artifact@v4
        with:
          name: api-alignment-report
          path: api-alignment-report.json

      - name: Upload DB alignment report
        uses: actions/upload-artifact@v4
        with:
          name: db-alignment-report
          path: db-alignment-report.json
