version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      timezone: 'America/Sao_Paulo'
    # Security updates bypass this version-update schedule and remain ungrouped.
    cooldown:
      default-days: 90
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      timezone: 'America/Sao_Paulo'
    cooldown:
      default-days: 90
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/docs/site'
    schedule:
      interval: 'monthly'
      timezone: 'America/Sao_Paulo'
    # The documentation site has its own lockfile and is security-scanned.
    cooldown:
      default-days: 90
    open-pull-requests-limit: 2
    groups:
      docs-npm-minor-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/infra/aws/cdk'
    schedule:
      interval: 'monthly'
      timezone: 'America/Sao_Paulo'
    # CDK updates are isolated so infrastructure compatibility is reviewed explicitly.
    cooldown:
      default-days: 90
    open-pull-requests-limit: 2
    groups:
      cdk-npm-minor-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
