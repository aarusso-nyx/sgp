<section class="auth-callback">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title i18n>Autenticação</mat-card-title>
      <mat-card-subtitle i18n>Callback OAuth2 / Cognito</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-spinner diameter="28"></mat-spinner>
      <p>{{ message }}</p>
      <a routerLink="/gestao" i18n>Ir para o módulo de Gestão</a>
    </mat-card-content>
  </mat-card>
</section>
