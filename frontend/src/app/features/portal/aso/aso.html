<section class="portal-aso">
  <header>
    <p i18n>Portal do servidor</p>
    <h1 i18n>Meus ASOs</h1>
    <button type="button" (click)="load()" i18n>Atualizar</button>
  </header>

  <table>
    <thead>
      <tr>
        <th i18n>Tipo</th>
        <th i18n>Realizacao</th>
        <th i18n>Conclusao</th>
        <th i18n>Proximo exame</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let record of records">
        <td>{{ record.asoKind }}</td>
        <td>{{ record.performedAt || record.scheduledAt }}</td>
        <td>{{ record.conclusion || '-' }}</td>
        <td>{{ record.nextExamDueAt || '-' }}</td>
      </tr>
      <tr *ngIf="!records.length">
        <td colspan="4" i18n>Nenhum ASO disponivel.</td>
      </tr>
    </tbody>
  </table>
</section>
