<section class="portal-justificativa" aria-labelledby="portal-justificativa-title">
  <header>
    <p i18n>Portal do servidor</p>
    <h1 id="portal-justificativa-title" i18n>Justificativa de ausencia</h1>
  </header>

  <p class="portal-justificativa__message" *ngIf="message" role="status">{{ message }}</p>
  <p class="portal-justificativa__error" *ngIf="error" role="alert">{{ error }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="portal-justificativa__panel">
    <label>
      <span i18n>Servidor</span>
      <input formControlName="employeeId" />
    </label>
    <label>
      <span i18n>Usuario solicitante</span>
      <input formControlName="requestedByUserId" />
    </label>
    <label>
      <span i18n>Tipo</span>
      <select formControlName="kind">
        <option value="MEDICAL" i18n>Atestado medico</option>
        <option value="BEREAVEMENT" i18n>Luto</option>
        <option value="MARRIAGE" i18n>Casamento</option>
        <option value="BLOOD_DONATION" i18n>Doacao de sangue</option>
        <option value="LEGAL_DUTY" i18n>Obrigacao legal</option>
        <option value="OTHER" i18n>Outro</option>
      </select>
    </label>
    <label>
      <span i18n>Inicio</span>
      <input type="datetime-local" formControlName="absenceStart" />
    </label>
    <label>
      <span i18n>Fim</span>
      <input type="datetime-local" formControlName="absenceEnd" />
    </label>
    <label>
      <span i18n>Anexo</span>
      <input formControlName="attachmentId" />
    </label>
    <label class="portal-justificativa__wide">
      <span i18n>Justificativa</span>
      <textarea formControlName="reason" rows="4"></textarea>
    </label>
    <button type="submit" [disabled]="saving" i18n>Enviar</button>
  </form>

  <section class="portal-justificativa__panel">
    <h2 i18n>Minhas solicitacoes</h2>
    <ol>
      <li *ngFor="let request of requests">
        <strong>{{ request.kind }}</strong>
        <span>{{ request.status }}</span>
        <span
          >{{ request.absenceStart | date: 'short' }} -
          {{ request.absenceEnd | date: 'short' }}</span
        >
      </li>
    </ol>
  </section>
</section>
