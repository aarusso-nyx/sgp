<section class="portal-concursos">
  <h1 i18n>Concursos publicos</h1>
  <article *ngFor="let concurso of concursos">
    <h2>{{ concurso.name }}</h2>
    <dl>
      <dt i18n>Codigo</dt>
      <dd>{{ concurso.code }}</dd>
      <dt i18n>Inscricoes ate</dt>
      <dd>{{ concurso.validUntil }}</dd>
    </dl>
    <a [href]="concurso.publicUrl" i18n>Baixar edital</a>
  </article>
</section>
