<section class="program-page">
  <header>
    <p i18n>Saude ocupacional</p>
    <h1 i18n>PCMSO</h1>
  </header>

  <div class="grid">
    <form [formGroup]="form" (ngSubmit)="create()" class="panel">
      <h2 i18n>Programa</h2>
      <label><span i18n>Estabelecimento</span><input formControlName="workLocationId" /></label>
      <label><span i18n>Inicio</span><input type="date" formControlName="validFrom" /></label>
      <label><span i18n>Fim</span><input type="date" formControlName="validUntil" /></label>
      <label><span i18n>CRM</span><input formControlName="responsibleDoctorCrm" /></label>
      <label
        ><span i18n>Medico responsavel</span><input formControlName="responsibleDoctorName"
      /></label>
      <button type="submit" [disabled]="saving" i18n>Salvar rascunho</button>
    </form>

    <form [formGroup]="examForm" (ngSubmit)="addExam()" class="panel">
      <h2 i18n>Exames obrigatorios</h2>
      <label><span i18n>PCMSO</span><input formControlName="healthProgramId" /></label>
      <label><span i18n>Exame</span><input formControlName="medicalExamId" /></label>
      <label><span i18n>Cargo</span><input formControlName="appliesToRoleId" /></label>
      <label
        ><span i18n>Periodicidade</span
        ><input type="number" formControlName="periodicityMonthsOverride"
      /></label>
      <button type="submit" i18n>Vincular exame</button>
    </form>
  </div>

  <table>
    <thead>
      <tr>
        <th i18n>Estabelecimento</th>
        <th i18n>Vigencia</th>
        <th i18n>Responsavel</th>
        <th i18n>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let program of programs">
        <td>{{ program.workLocationName || program.id }}</td>
        <td>{{ program.validFrom }} - {{ program.validUntil }}</td>
        <td>{{ program.responsibleDoctorName }}</td>
        <td>{{ program.status }}</td>
        <td><button type="button" (click)="activate(program)" i18n>Ativar</button></td>
      </tr>
    </tbody>
  </table>
</section>
