<section class="ppp-page">
  <header>
    <p i18n>Saude ocupacional</p>
    <h1 i18n>PPP</h1>
  </header>

  <form [formGroup]="form" (ngSubmit)="generate()" class="panel">
    <h2 i18n>Geracao</h2>
    <label><span i18n>Servidor</span><input formControlName="employeeId" /></label>
    <label><span i18n>Inicio</span><input type="date" formControlName="periodStart" /></label>
    <label><span i18n>Fim</span><input type="date" formControlName="periodEnd" /></label>
    <button type="submit" [disabled]="saving" i18n>Gerar PPP</button>
    <p class="error" *ngIf="error">{{ error }}</p>
  </form>

  <table>
    <thead>
      <tr>
        <th i18n>Servidor</th>
        <th i18n>Periodo</th>
        <th i18n>Exposicoes</th>
        <th i18n>EPIs</th>
        <th i18n>Gerado em</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <td>{{ row.employeeId }}</td>
        <td>{{ row.periodStart }} - {{ row.periodEnd }}</td>
        <td>{{ row.snapshotJson.environmentalExposures?.length || 0 }}</td>
        <td>{{ row.snapshotJson.epiDeliveries?.length || 0 }}</td>
        <td>{{ row.generatedAt }}</td>
      </tr>
    </tbody>
  </table>
</section>
