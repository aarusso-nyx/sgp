<section class="pericia">
  <header>
    <p i18n>Saude ocupacional</p>
    <h1 i18n>Licenca de saude e pericia</h1>
  </header>

  <p *ngIf="message" class="message" role="status">{{ message }}</p>
  <p *ngIf="error" class="error" role="alert">{{ error }}</p>

  <div class="layout">
    <form [formGroup]="scheduleForm" (ngSubmit)="schedule()" class="panel">
      <h2 i18n>Agenda de pericias</h2>
      <label>
        <span i18n>Servidor</span>
        <input formControlName="employeeId" placeholder="UUID do servidor" i18n-placeholder />
      </label>
      <label>
        <span i18n>Janela</span>
        <input formControlName="slotRef" />
      </label>
      <label>
        <span i18n>Data</span>
        <input type="date" formControlName="scheduledOn" />
      </label>
      <label>
        <span i18n>Hora</span>
        <input formControlName="scheduledTime" />
      </label>
      <label>
        <span i18n>Telefone</span>
        <input formControlName="contactPhone" />
      </label>
      <button type="submit" [disabled]="saving" i18n>Agendar</button>
    </form>

    <form [formGroup]="opinionForm" (ngSubmit)="recordOpinion()" class="panel">
      <h2 i18n>Parecer pericial</h2>
      <label>
        <span i18n>Agendamento</span>
        <input formControlName="appointmentId" />
      </label>
      <label>
        <span i18n>Medico</span>
        <input formControlName="physicianId" />
      </label>
      <label>
        <span i18n>Decisao</span>
        <select formControlName="decision">
          <option value="granted" i18n>Concedida</option>
          <option value="denied" i18n>Negada</option>
        </select>
      </label>
      <label>
        <span i18n>CID-10</span>
        <input formControlName="cidCode" />
      </label>
      <label>
        <span i18n>CID secundario</span>
        <input formControlName="cidSecondary" />
      </label>
      <label>
        <span i18n>Dias</span>
        <input type="number" min="1" formControlName="grantedDays" />
      </label>
      <label>
        <span i18n>Inicio</span>
        <input type="date" formControlName="startsOn" />
      </label>
      <label>
        <span i18n>Fim</span>
        <input type="date" formControlName="endsOn" />
      </label>
      <label class="wide">
        <span i18n>Motivo</span>
        <textarea formControlName="reason"></textarea>
      </label>
      <label class="wide">
        <span i18n>Parecer</span>
        <textarea formControlName="opinionNotes"></textarea>
      </label>
      <button type="submit" [disabled]="saving" i18n>Registrar parecer</button>
    </form>
  </div>

  <section class="panel">
    <form [formGroup]="lookupForm" (ngSubmit)="loadLeaves()" class="toolbar">
      <label>
        <span i18n>Servidor</span>
        <input formControlName="employeeId" placeholder="UUID do servidor" i18n-placeholder />
      </label>
      <button type="submit" [disabled]="loading" i18n>Carregar licencas</button>
    </form>

    <table>
      <thead>
        <tr>
          <th i18n>Periodo</th>
          <th i18n>Dias</th>
          <th i18n>CID</th>
          <th i18n>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let leave of leaves">
          <td i18n>{{ leave.startsOn }} a {{ leave.endsOn }}</td>
          <td>{{ leave.grantedDays }}</td>
          <td>{{ leave.cidCode || '-' }}</td>
          <td>{{ leave.status }}</td>
        </tr>
        <tr *ngIf="!leaves.length">
          <td colspan="4" i18n>Nenhuma licenca carregada.</td>
        </tr>
      </tbody>
    </table>
  </section>
</section>
