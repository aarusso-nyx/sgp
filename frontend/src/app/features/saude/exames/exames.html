<section class="saude-exames">
  <header>
    <p i18n>Saude ocupacional</p>
    <h1 i18n>Exames ocupacionais</h1>
  </header>

  <form [formGroup]="form" (ngSubmit)="create()" class="panel">
    <label>
      <span i18n>Codigo</span>
      <input formControlName="code" />
    </label>
    <label>
      <span i18n>Nome</span>
      <input formControlName="name" />
    </label>
    <label>
      <span i18n>Tipo</span>
      <select formControlName="examType">
        <option value="CLINICO" i18n>Clinico</option>
        <option value="LABORATORIAL" i18n>Laboratorial</option>
        <option value="COMPLEMENTAR" i18n>Complementar</option>
        <option value="IMAGEM" i18n>Imagem</option>
      </select>
    </label>
    <label>
      <span i18n>Periodicidade</span>
      <input type="number" min="1" formControlName="periodicityMonths" />
    </label>
    <label class="check">
      <input type="checkbox" formControlName="isMandatoryAdmission" />
      <span i18n>Admissional</span>
    </label>
    <label class="check">
      <input type="checkbox" formControlName="isMandatoryPeriodic" />
      <span i18n>Periodico</span>
    </label>
    <button type="submit" [disabled]="saving" i18n>Salvar</button>
  </form>

  <section class="panel">
    <button type="button" (click)="load()" [disabled]="loading" i18n>Atualizar</button>
    <table>
      <thead>
        <tr>
          <th i18n>Codigo</th>
          <th i18n>Nome</th>
          <th i18n>Tipo</th>
          <th i18n>Meses</th>
          <th i18n>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let exam of exams">
          <td>{{ exam.code }}</td>
          <td>{{ exam.name }}</td>
          <td>{{ exam.examType }}</td>
          <td>{{ exam.periodicityMonths || '-' }}</td>
          <td>{{ exam.active ? 'Ativo' : 'Inativo' }}</td>
        </tr>
      </tbody>
    </table>
  </section>
</section>
