<section class="program-page">
  <header>
    <p i18n>Saude ocupacional</p>
    <h1 i18n>PGR</h1>
  </header>

  <form [formGroup]="form" (ngSubmit)="create()" class="panel">
    <h2 i18n>Programa</h2>
    <label><span i18n>Estabelecimento</span><input formControlName="workLocationId" /></label>
    <label><span i18n>Inicio</span><input type="date" formControlName="validFrom" /></label>
    <label><span i18n>Fim</span><input type="date" formControlName="validUntil" /></label>
    <label
      ><span i18n>Engenheiro responsavel</span><input formControlName="responsibleEngineerId"
    /></label>
    <button type="submit" [disabled]="saving" i18n>Salvar rascunho</button>
  </form>

  <table>
    <thead>
      <tr>
        <th i18n>Estabelecimento</th>
        <th i18n>Vigencia</th>
        <th i18n>Riscos</th>
        <th i18n>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let program of programs">
        <td>{{ program.workLocationName || program.id }}</td>
        <td>{{ program.validFrom }} - {{ program.validUntil }}</td>
        <td>{{ program.riskSnapshot.length }}</td>
        <td>{{ program.status }}</td>
        <td><button type="button" (click)="activate(program)" i18n>Ativar</button></td>
      </tr>
    </tbody>
  </table>
</section>
