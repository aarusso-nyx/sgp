<section class="geofence-admin">
  <header>
    <h1 i18n>Geofence de lotacao</h1>
    <button type="button" (click)="preview()" i18n>Validar</button>
  </header>

  <form [formGroup]="form">
    <label>
      <ng-container i18n>Lotacao</ng-container>
      <input formControlName="workLocationId" placeholder="UUID da lotacao" i18n-placeholder />
    </label>
    <label>
      <ng-container i18n>Poligono</ng-container>
      <textarea formControlName="polygonText" rows="8"></textarea>
    </label>
  </form>

  <div class="preview" [class.invalid]="!valid()">
    <div class="point" *ngFor="let point of points()">{{ point.lat }}, {{ point.lon }}</div>
  </div>
  <p>{{ message }}</p>
</section>
