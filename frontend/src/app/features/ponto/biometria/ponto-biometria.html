<section class="ponto-biometria">
  <header>
    <h1 i18n>Biometria de ponto</h1>
    <button type="button" (click)="load()" [disabled]="loading" i18n>Atualizar</button>
  </header>

  <form [formGroup]="form" (ngSubmit)="enroll()">
    <label>
      <ng-container i18n>Servidor</ng-container>
      <input formControlName="employeeId" placeholder="UUID do empregado" i18n-placeholder />
    </label>
    <label>
      <ng-container i18n>Tipo</ng-container>
      <select formControlName="kind">
        <option value="FINGERPRINT" i18n>Digital</option>
        <option value="PALM_VEIN" i18n>Palmar</option>
      </select>
    </label>
    <label>
      <ng-container i18n>Amostra do leitor</ng-container>
      <textarea formControlName="sampleBase64" rows="4"></textarea>
    </label>
    <label>
      <ng-container i18n>KMS key</ng-container>
      <input formControlName="templateKmsKeyId" />
    </label>
    <label>
      <ng-container i18n>Qualidade minima</ng-container>
      <input formControlName="minimumQuality" type="number" min="0" max="1" step="0.01" />
    </label>
    <label>
      <ng-container i18n>Termo</ng-container>
      <input formControlName="consentVersion" />
    </label>
    <button type="submit" [disabled]="saving" i18n>Cadastrar</button>
  </form>

  <p class="message" *ngIf="message">{{ message }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <table>
    <thead>
      <tr>
        <th i18n>Servidor</th>
        <th i18n>Tipo</th>
        <th i18n>Qualidade</th>
        <th i18n>Status</th>
        <th i18n>Captura</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let template of templates">
        <td>{{ template.employeeId }}</td>
        <td>{{ template.kind }}</td>
        <td>{{ template.qualityScore }}</td>
        <td>{{ template.status }}</td>
        <td>{{ template.capturedAt | date: 'short' }}</td>
      </tr>
    </tbody>
  </table>
</section>
