<section class="face-admin">
  <header>
    <h1 i18n>Reconhecimento facial</h1>
    <button type="button" (click)="loadTemplates()" [disabled]="loading" i18n>Atualizar</button>
  </header>

  <form [formGroup]="thresholdForm" (ngSubmit)="saveThreshold()" class="threshold">
    <label>
      <ng-container i18n>Threshold</ng-container>
      <input formControlName="threshold" type="number" min="0" max="1" step="0.01" />
    </label>
    <label class="check">
      <input formControlName="livenessRequired" type="checkbox" />
      <ng-container i18n>Liveness obrigatorio</ng-container>
    </label>
    <button type="submit" [disabled]="saving" i18n>Salvar threshold</button>
  </form>

  <form [formGroup]="enrollForm" (ngSubmit)="enroll()">
    <label>
      <ng-container i18n>Servidor</ng-container>
      <input formControlName="employeeId" placeholder="UUID do empregado" i18n-placeholder />
    </label>
    <label>
      <ng-container i18n>Frame rosto aberto</ng-container>
      <textarea formControlName="frameOpenBase64" rows="4"></textarea>
    </label>
    <label>
      <ng-container i18n>Frame piscando</ng-container>
      <textarea formControlName="frameBlinkBase64" rows="4"></textarea>
    </label>
    <label>
      <ng-container i18n>KMS key</ng-container>
      <input formControlName="templateKmsKeyId" />
    </label>
    <label>
      <ng-container i18n>Termo LGPD art. 11</ng-container>
      <input formControlName="consentVersion" />
    </label>
    <button type="submit" [disabled]="saving" i18n>Cadastrar face</button>
  </form>

  <p class="message" *ngIf="message">{{ message }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <table>
    <thead>
      <tr>
        <th i18n>Servidor</th>
        <th i18n>Modelo</th>
        <th i18n>Versao</th>
        <th i18n>Status</th>
        <th i18n>Captura</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let template of templates">
        <td>{{ template.employeeId }}</td>
        <td>{{ template.modelId }}</td>
        <td>{{ template.modelVersion }}</td>
        <td>{{ template.status }}</td>
        <td>{{ template.capturedAt | date: 'short' }}</td>
      </tr>
    </tbody>
  </table>
</section>
