<section class="history" aria-labelledby="history-title">
  <header class="history__header">
    <div>
      <p i18n>Recursos Humanos</p>
      <h1 id="history-title" i18n>Historico funcional</h1>
    </div>
    <label>
      <span i18n>Inicio</span>
      <input type="date" [(ngModel)]="startDate" />
    </label>
    <label>
      <span i18n>Fim</span>
      <input type="date" [(ngModel)]="endDate" />
    </label>
    <label>
      <span i18n>Tipo</span>
      <select [(ngModel)]="type">
        <option value="" i18n>Todos</option>
        <option value="functional_status" i18n>Situacao</option>
        <option value="vacation" i18n>Ferias</option>
        <option value="leave" i18n>Licenca</option>
        <option value="medical_leave" i18n>Licenca medica</option>
        <option value="service_time" i18n>Tempo de servico</option>
      </select>
    </label>
    <button type="button" mat-stroked-button (click)="load()" i18n>Filtrar</button>
  </header>

  <p class="history__error" *ngIf="error" role="alert">{{ error }}</p>
  <p *ngIf="loading" i18n>Carregando...</p>

  <ol class="history__timeline" aria-label="Linha do tempo funcional" i18n-aria-label>
    <li *ngFor="let event of events">
      <time>{{ event.date }}</time>
      <div>
        <strong>{{ event.title }}</strong>
        <span>{{ event.type }}</span>
        <p *ngIf="event.notes">{{ event.notes }}</p>
      </div>
    </li>
  </ol>
</section>
