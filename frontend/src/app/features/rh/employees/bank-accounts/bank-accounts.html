<section class="bank-accounts">
  <header>
    <div>
      <p i18n>Recursos Humanos</p>
      <h1 i18n>Dados bancarios do servidor</h1>
    </div>
    <label>
      <span i18n>Servidor</span>
      <input [(ngModel)]="employeeId" />
    </label>
    <button type="button" mat-stroked-button (click)="load()" i18n>Carregar</button>
  </header>

  <p *ngIf="message" role="status" class="message">{{ message }}</p>
  <p *ngIf="error" role="alert" class="error">{{ error }}</p>
  <p *ngIf="loading" i18n>Carregando...</p>

  <table aria-label="Contas bancarias" i18n-aria-label>
    <thead>
      <tr>
        <th i18n>Banco</th>
        <th i18n>Agencia</th>
        <th i18n>Conta</th>
        <th i18n>Status</th>
        <th i18n>Historico</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <td>{{ row.bankCode }}</td>
        <td>{{ row.agency }}</td>
        <td>{{ row.accountNumber }}</td>
        <td>{{ row.validationStatus }}</td>
        <td>{{ row.updatedAt }}</td>
        <td>
          <button type="button" mat-stroked-button (click)="revalidate(row)" i18n>Revalidar</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
