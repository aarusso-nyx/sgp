<section class="transfer">
  <header>
    <p i18n>Recursos Humanos</p>
    <h1 i18n>Movimentacao e transferencia</h1>
  </header>

  <p *ngIf="message" class="message" role="status">{{ message }}</p>
  <p *ngIf="error" class="error" role="alert">{{ error }}</p>
  <p *ngIf="loading" i18n>Carregando...</p>

  <div class="queue-grid">
    <article *ngFor="let status of statuses" class="queue">
      <h2>{{ status }}</h2>
      <table [attr.aria-label]="'Movimentacoes ' + status">
        <thead>
          <tr>
            <th i18n>Servidor</th>
            <th i18n>Tipo</th>
            <th i18n>Efeito</th>
            <th i18n>Destino</th>
            <th i18n>Acoes</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of queues[status]">
            <td>{{ item.employeeId }}</td>
            <td>{{ item.tipo }}</td>
            <td>{{ item.dataEfeito }}</td>
            <td>{{ item.destinoWorkLocationId }}</td>
            <td>
              <button
                *ngIf="item.status === 'solicitada'"
                type="button"
                mat-stroked-button
                (click)="approve(item)"
                [disabled]="savingId === item.id"
                i18n
              >
                Aprovar
              </button>
              <button
                *ngIf="item.status === 'aprovada'"
                type="button"
                mat-stroked-button
                (click)="effect(item)"
                [disabled]="savingId === item.id"
                i18n
              >
                Efetivar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </article>
  </div>
</section>
