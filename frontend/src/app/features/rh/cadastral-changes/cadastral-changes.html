<section class="cadastral">
  <header>
    <p i18n>Recursos Humanos</p>
    <h1 i18n>Atualizacoes cadastrais</h1>
  </header>

  <p *ngIf="message" class="message" role="status">{{ message }}</p>
  <p *ngIf="error" class="error" role="alert">{{ error }}</p>
  <p *ngIf="loading" i18n>Carregando...</p>

  <table aria-label="Pendencias cadastrais" i18n-aria-label>
    <thead>
      <tr>
        <th i18n>Servidor</th>
        <th i18n>Secao</th>
        <th i18n>Solicitado em</th>
        <th i18n>Payload</th>
        <th i18n>Acoes</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let change of changes">
        <td>{{ change.registration }} - {{ change.employeeName }}</td>
        <td>{{ change.section }}</td>
        <td>{{ change.requestedAt }}</td>
        <td>
          <pre>{{ payload(change) }}</pre>
        </td>
        <td>
          <button
            type="button"
            mat-stroked-button
            (click)="approve(change)"
            [disabled]="savingId === change.id"
            i18n
          >
            Aprovar
          </button>
          <button
            type="button"
            mat-stroked-button
            (click)="reject(change)"
            [disabled]="savingId === change.id"
            i18n
          >
            Rejeitar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
