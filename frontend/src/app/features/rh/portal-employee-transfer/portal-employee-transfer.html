<section class="portal-transfer">
  <header>
    <p i18n>Portal do servidor</p>
    <h1 i18n>Solicitacao de movimentacao</h1>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field>
      <mat-label i18n>Servidor</mat-label>
      <input matInput formControlName="employeeId" />
    </mat-form-field>
    <mat-form-field>
      <mat-label i18n>Lotacao destino</mat-label>
      <input matInput formControlName="destinoWorkLocationId" />
    </mat-form-field>
    <mat-form-field>
      <mat-label i18n>Data de efeito</mat-label>
      <input matInput type="date" formControlName="dataEfeito" />
    </mat-form-field>
    <mat-form-field>
      <mat-label i18n>Tipo</mat-label>
      <input matInput formControlName="tipo" />
    </mat-form-field>
    <mat-form-field>
      <mat-label i18n>Justificativa</mat-label>
      <input matInput formControlName="notes" />
    </mat-form-field>
    <button type="submit" mat-flat-button [disabled]="saving" i18n>Solicitar</button>
    <button type="button" mat-stroked-button (click)="loadHistory()" i18n>Historico</button>
  </form>

  <p *ngIf="message" class="message" role="status">{{ message }}</p>
  <p *ngIf="error" class="error" role="alert">{{ error }}</p>
  <p *ngIf="loading" i18n>Carregando...</p>

  <table aria-label="Historico de movimentacoes" i18n-aria-label>
    <thead>
      <tr>
        <th i18n>Tipo</th>
        <th i18n>Efeito</th>
        <th i18n>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of history">
        <td>{{ item.tipo }}</td>
        <td>{{ item.dataEfeito }}</td>
        <td>{{ item.status }}</td>
      </tr>
    </tbody>
  </table>
</section>
