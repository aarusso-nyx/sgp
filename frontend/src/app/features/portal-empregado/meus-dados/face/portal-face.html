<section class="portal-face">
  <header>
    <h1 i18n>Reconhecimento facial</h1>
  </header>

  <form [formGroup]="form">
    <label>
      <ng-container i18n>Servidor</ng-container>
      <input formControlName="employeeId" placeholder="UUID do empregado" i18n-placeholder />
    </label>
    <button type="button" (click)="load()" i18n>Consultar</button>
    <button type="button" (click)="revoke()" [disabled]="saving" i18n>Solicitar exclusao</button>
  </form>

  <dl *ngIf="status">
    <dt i18n>Status</dt>
    <dd>{{ status['status'] || 'SEM TEMPLATE' }}</dd>
    <dt i18n>Captura</dt>
    <dd>{{ status['capturedAt'] || '-' }}</dd>
    <dt i18n>Modelo</dt>
    <dd>{{ status['modelId'] || '-' }}</dd>
    <dt i18n>Versao</dt>
    <dd>{{ status['modelVersion'] || '-' }}</dd>
  </dl>

  <p class="message" *ngIf="message">{{ message }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>
</section>
