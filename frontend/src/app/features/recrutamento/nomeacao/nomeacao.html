<section class="appointment-workspace">
  <header class="toolbar">
    <div>
      <h1>Nomeacao e convocacao</h1>
      <p>Ordem de chamada por vaga</p>
    </div>
    <label>
      Concurso
      <input name="concursoId" [(ngModel)]="concursoId" placeholder="UUID do concurso" />
    </label>
    <label>
      Ato administrativo
      <input name="atoAdministrativo" [(ngModel)]="atoAdministrativo" />
    </label>
    <label class="toggle">
      <input type="checkbox" name="emailEnabled" [(ngModel)]="emailEnabled" />
      Enviar email
    </label>
  </header>

  <section class="call-grid" aria-label="Proximas chamadas">
    <article *ngFor="let call of nextCalls">
      <span>{{ call.nextOrder }}</span>
      <strong>{{ call.candidateName }}</strong>
      <small>{{ call.vaga }}</small>
      <em>{{ call.bucket }}</em>
      <time>{{ call.deadline }}</time>
      <button type="button" (click)="appoint(call)">Nomear</button>
    </article>
  </section>

  <table>
    <thead>
      <tr>
        <th>Candidato</th>
        <th>Ato</th>
        <th>Status</th>
        <th>Canal</th>
        <th>Evidencia</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let notice of notices">
        <td>{{ notice.candidateName }}</td>
        <td>{{ notice.ato }}</td>
        <td>{{ notice.status }}</td>
        <td>{{ notice.channel }}</td>
        <td>{{ notice.evidenceRef }}</td>
        <td>
          <button
            type="button"
            [disabled]="notice.status === 'DESISTENTE'"
            (click)="withdraw(notice)"
          >
            Desistencia
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
