<section class="concurso-workspace">
  <header>
    <h1>Concursos publicos</h1>
    <nav aria-label="Etapas">
      <button [class.active]="step === 'general'" type="button">Dados</button>
      <button [class.active]="step === 'seats'" type="button">Vagas</button>
      <button [class.active]="step === 'edital'" type="button">Edital</button>
      <button [class.active]="step === 'publish'" type="button">Publicacao</button>
    </nav>
  </header>

  <form>
    <fieldset *ngIf="step === 'general'">
      <label>Codigo <input name="code" [(ngModel)]="draft.code" /></label>
      <label>Nome <input name="name" [(ngModel)]="draft.name" /></label>
      <label>Validade <input name="validUntil" type="date" [(ngModel)]="draft.validUntil" /></label>
    </fieldset>

    <fieldset *ngIf="step === 'seats'">
      <div class="seat-row" *ngFor="let seat of seats; index as i">
        <label>Cargo <input [name]="'positionId' + i" [(ngModel)]="seat.positionId" /></label>
        <label
          >Total <input [name]="'totalSeats' + i" type="number" [(ngModel)]="seat.totalSeats"
        /></label>
        <label
          >PCD <input [name]="'pcdSeats' + i" type="number" [(ngModel)]="seat.pcdSeats"
        /></label>
        <label
          >Negros <input [name]="'racialSeats' + i" type="number" [(ngModel)]="seat.racialSeats"
        /></label>
        <label
          >Indigenas/quilombolas
          <input [name]="'indigenousSeats' + i" type="number" [(ngModel)]="seat.indigenousSeats"
        /></label>
        <label>Salario <input [name]="'baseSalary' + i" [(ngModel)]="seat.baseSalary" /></label>
      </div>
      <button type="button" (click)="addSeat()">Adicionar vaga</button>
    </fieldset>

    <fieldset *ngIf="step === 'edital'">
      <label>Documento <input name="editalRef" [(ngModel)]="draft.editalRef" /></label>
      <label>Ato <input name="administrativeAct" [(ngModel)]="draft.administrativeAct" /></label>
      <label
        >Data do ato
        <input name="administrativeActDate" type="date" [(ngModel)]="draft.administrativeActDate"
      /></label>
    </fieldset>

    <fieldset *ngIf="step === 'publish'">
      <label>URL publica <input name="publicUrl" [(ngModel)]="draft.publicUrl" /></label>
      <p>
        O edital publicado aparece no Portal Transparencia apos validacao do ato administrativo.
      </p>
    </fieldset>
  </form>

  <footer>
    <button type="button" (click)="previous()" [disabled]="step === 'general'">Voltar</button>
    <button type="button" (click)="next()" [disabled]="step === 'publish'">Avancar</button>
  </footer>
</section>
