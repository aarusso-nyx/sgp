<section class="banca-workspace">
  <header>
    <h1 i18n>Banca examinadora</h1>
    <nav aria-label="Fluxo da banca" i18n-aria-label>
      <button type="button" [class.active]="view === 'members'" (click)="setView('members')" i18n>
        Membros
      </button>
      <button type="button" [class.active]="view === 'signing'" (click)="setView('signing')" i18n>
        Assinatura
      </button>
      <button type="button" [class.active]="view === 'publish'" (click)="setView('publish')" i18n>
        Publicacao
      </button>
    </nav>
  </header>

  <form *ngIf="view === 'members'" class="panel">
    <label
      ><ng-container i18n>Nome</ng-container> <input name="fullName" [(ngModel)]="member.fullName"
    /></label>
    <label
      ><ng-container i18n>CPF</ng-container>
      <input name="cpf" inputmode="numeric" maxlength="11" [(ngModel)]="member.cpf"
    /></label>
    <label>
      <ng-container i18n>Funcao</ng-container>
      <select name="role" [(ngModel)]="member.role">
        <option value="PRESIDENTE" i18n>Presidente</option>
        <option value="MEMBRO" i18n>Membro</option>
        <option value="SECRETARIO" i18n>Secretario</option>
      </select>
    </label>
    <label>
      <ng-container i18n>Certificado</ng-container>
      <select name="certKind" [(ngModel)]="member.certKind">
        <option value="ICP_A1" i18n>ICP-Brasil A1</option>
        <option value="ICP_A3" i18n>ICP-Brasil A3</option>
        <option value="GOVBR_OURO" i18n>GovBR ouro</option>
        <option value="GOVBR_PRATA" i18n>GovBR prata</option>
      </select>
    </label>
  </form>

  <div *ngIf="view === 'signing'" class="panel">
    <article *ngFor="let document of pendingDocuments">
      <strong>{{ document.kind }}</strong>
      <span>{{ document.sourceRef }}</span>
      <progress [value]="document.signed" [max]="document.required"></progress>
      <button type="button" i18n>Assinar proximo</button>
    </article>
  </div>

  <div *ngIf="view === 'publish'" class="panel">
    <label
      ><ng-container i18n>Link publico</ng-container>
      <input value="/publico/banca/verify/token" readonly
    /></label>
    <div class="qr" aria-label="QR de verificacao publica" i18n-aria-label></div>
    <button type="button" i18n>Publicar documento assinado</button>
  </div>
</section>
