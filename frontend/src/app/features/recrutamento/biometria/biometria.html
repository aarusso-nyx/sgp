<section class="biometric-review">
  <header>
    <h1 i18n>Conferencia biometrica</h1>
    <strong
      [class.accept]="result.decision === 'ACCEPT'"
      [class.reject]="result.decision === 'REJECT'"
    >
      {{ result.decision }}
    </strong>
  </header>

  <form>
    <label
      ><ng-container i18n>Candidato</ng-container>
      <input name="candidatoId" [(ngModel)]="search.candidatoId"
    /></label>
    <label
      ><ng-container i18n>Sessao de prova</ng-container>
      <input name="examSessionId" [(ngModel)]="search.examSessionId"
    /></label>
    <label
      ><ng-container i18n>Leitor</ng-container>
      <input name="deviceRef" [(ngModel)]="search.deviceRef"
    /></label>
    <button type="button" (click)="runMatch()" i18n>Conferir digital</button>
  </form>

  <dl>
    <div>
      <dt i18n>Score</dt>
      <dd>{{ result.score }}</dd>
    </div>
    <div>
      <dt i18n>Threshold</dt>
      <dd>{{ result.threshold }}</dd>
    </div>
    <div>
      <dt i18n>Template</dt>
      <dd i18n>Oculto</dd>
    </div>
  </dl>
</section>
