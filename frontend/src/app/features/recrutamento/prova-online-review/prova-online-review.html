<section class="review-workspace">
  <header>
    <div>
      <h1 i18n>Revisao de prova online</h1>
      <span>{{ selectedSessionId }}</span>
    </div>
    <strong [class.reject]="decision === 'REJECT'" [class.accept]="decision === 'ACCEPT'">
      {{ decision }}
    </strong>
  </header>

  <main>
    <section class="timeline">
      <article *ngFor="let event of events" [class.severe]="event.severity === 'SEVERE'">
        <time>{{ event.at }}</time>
        <h2>{{ event.kind }}</h2>
        <p>{{ event.evidenceRef }}</p>
        <span>{{ event.severity }} / {{ event.decision }}</span>
      </article>
    </section>

    <aside>
      <div class="player">
        <span i18n>SNAPSHOT</span>
      </div>
      <audio controls></audio>
      <label>
        <ng-container i18n>Motivo</ng-container>
        <textarea name="voidReason" [(ngModel)]="voidReason"></textarea>
      </label>
      <div class="actions">
        <button type="button" (click)="accept()" i18n>Aceitar</button>
        <button
          type="button"
          class="danger"
          (click)="voidSession()"
          [disabled]="!voidReason.trim()"
          i18n
        >
          Anular e reagendar
        </button>
      </div>
    </aside>
  </main>
</section>
