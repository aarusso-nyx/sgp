<section class="online-exam" [class.recording]="recording">
  <header class="exam-header">
    <div>
      <h1 i18n>Prova online</h1>
      <span>{{ state | uppercase }}</span>
    </div>
    <strong>{{ remainingLabel }}</strong>
  </header>

  <section class="media-grid">
    <video #cameraPreview muted playsinline></video>
    <video #screenPreview muted playsinline></video>
  </section>

  <section class="exam-controls" *ngIf="state === 'setup' || state === 'blocked'">
    <label class="consent">
      <input type="checkbox" [(ngModel)]="consentAccepted" />
      <ng-container i18n>Consentimento para gravacao de audio, video e tela</ng-container>
    </label>
    <button type="button" (click)="requestMedia()" i18n>Liberar camera, microfone e tela</button>
    <strong *ngIf="blockReason">{{ blockReason }}</strong>
  </section>

  <section class="exam-controls" *ngIf="state === 'ready'">
    <button type="button" (click)="start()" i18n>Iniciar prova</button>
  </section>

  <section class="question-surface" *ngIf="state === 'running'">
    <div class="recording-indicator" i18n>REC</div>
    <article>
      <h2 i18n>Questao 1</h2>
      <p i18n>Selecione a alternativa correta para concluir a avaliacao.</p>
      <label
        ><input type="radio" name="q1" /> <ng-container i18n>Alternativa A</ng-container></label
      >
      <label
        ><input type="radio" name="q1" /> <ng-container i18n>Alternativa B</ng-container></label
      >
      <label
        ><input type="radio" name="q1" /> <ng-container i18n>Alternativa C</ng-container></label
      >
    </article>
    <footer>
      <span i18n>Snapshot {{ lastSnapshotAt || '-' }}</span>
      <button type="button" (click)="submit()" i18n>Finalizar</button>
    </footer>
  </section>

  <section class="submitted" *ngIf="state === 'submitted'">
    <h2 i18n>Prova submetida</h2>
    <p i18n>Protocolo {{ sessionId }}</p>
  </section>
</section>
