<section class="notas-workspace">
  <header>
    <h1>Minhas notas</h1>
  </header>

  <form class="lookup">
    <label>Inscricao <input name="inscricaoId" [(ngModel)]="lookup.inscricaoId" /></label>
    <label>Token <input name="token" [(ngModel)]="lookup.token" /></label>
  </form>

  <section class="mirror">
    <h2>Espelho da prova</h2>
    <table>
      <thead>
        <tr>
          <th>Prova</th>
          <th>Bruta</th>
          <th>Ponderada</th>
          <th>Recalculo</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>OBJETIVA</td>
          <td>0.000000</td>
          <td>0.000000</td>
          <td>--</td>
        </tr>
      </tbody>
    </table>
  </section>

  <form class="resource">
    <h2>Recurso</h2>
    <label>Prova <input name="provaId" [(ngModel)]="recurso.provaId" /></label>
    <label>Questao <input name="questaoId" [(ngModel)]="recurso.questaoId" /></label>
    <label>Fundamentacao <textarea name="reason" [(ngModel)]="recurso.reason"></textarea></label>
  </form>
</section>
