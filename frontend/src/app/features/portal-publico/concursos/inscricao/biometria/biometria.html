<section class="candidate-biometrics">
  <header>
    <h1>Biometria do candidato</h1>
    <span [class.ready]="consentAccepted">LGPD art. 11 {{ consentVersion }}</span>
  </header>

  <div class="consent-panel" *ngIf="!consentAccepted">
    <h2>Consentimento especifico</h2>
    <p>
      Autorizo a captura de template de impressao digital e face para conferencia presencial de
      identidade no dia da prova, com retencao limitada ao edital e recursos.
    </p>
    <button type="button" (click)="acceptConsent()">Aceitar termo destacado</button>
  </div>

  <div class="capture-grid">
    <article>
      <h2>Digital</h2>
      <label>Dispositivo <input name="deviceRef" [(ngModel)]="capture.deviceRef" /></label>
      <meter min="0" max="1" [value]="fingerprintQuality"></meter>
      <button type="button" (click)="simulateFingerprintCapture()" [disabled]="!consentAccepted">
        Capturar digital
      </button>
    </article>

    <article>
      <h2>Face</h2>
      <label>Camera <input name="faceDeviceRef" [(ngModel)]="capture.faceDeviceRef" /></label>
      <meter min="0" max="1" [value]="faceQuality"></meter>
      <button type="button" (click)="simulateFaceCapture()" [disabled]="!consentAccepted">
        Capturar face
      </button>
    </article>
  </div>

  <footer>
    <label
      >Retencao ate <input name="retentionUntil" type="date" [(ngModel)]="capture.retentionUntil"
    /></label>
    <button type="button" (click)="requestDeletion()">Solicitar exclusao</button>
    <strong *ngIf="deletionRequested">Solicitacao LGPD art. 18 registrada</strong>
  </footer>
</section>
