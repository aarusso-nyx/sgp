<section class="pccs" aria-labelledby="pccs-title">
  <header class="pccs__header">
    <div>
      <p i18n>Avaliacao</p>
      <h1 id="pccs-title" i18n>PCCS</h1>
    </div>
    <button mat-flat-button color="primary" type="button" (click)="save()">
      <mat-icon>save</mat-icon>
      <ng-container i18n>Salvar</ng-container>
    </button>
  </header>

  <p class="pccs__message" *ngIf="message" role="status">{{ message }}</p>
  <p class="pccs__error" *ngIf="error" role="alert">{{ error }}</p>

  <div class="pccs__layout">
    <form [formGroup]="form" (ngSubmit)="save()" class="pccs__form">
      <label>
        <span i18n>Nome</span>
        <input formControlName="name" />
      </label>
      <label>
        <span i18n>Lei instituidora</span>
        <input formControlName="institutingLaw" />
      </label>
      <label>
        <span i18n>Vigencia inicial</span>
        <input type="date" formControlName="startsOn" />
      </label>
      <label>
        <span i18n>Vigencia final</span>
        <input type="date" formControlName="endsOn" />
      </label>
      <label>
        <span i18n>Classes</span>
        <input type="number" min="1" formControlName="classCount" />
      </label>
      <label>
        <span i18n>Referencias</span>
        <input type="number" min="1" formControlName="referenceCount" />
      </label>
      <label>
        <span i18n>Cargos vinculados</span>
        <input formControlName="jobPositionIds" />
      </label>
      <label>
        <span i18n>Faixa salarial</span>
        <input formControlName="salaryRangeId" />
      </label>
      <label class="pccs__wide">
        <span i18n>Regra de progressao</span>
        <textarea rows="8" formControlName="progressionRule"></textarea>
      </label>
    </form>

    <section class="pccs__tree" aria-label="Arvore PCCS" i18n-aria-label>
      <button
        mat-button
        type="button"
        *ngFor="let plan of plans"
        (click)="select(plan)"
        [class.pccs__node--active]="plan.id === selected?.id"
      >
        <strong>{{ plan.name }}</strong>
        <span i18n>{{ plan.classCount }} classes · {{ plan.referenceCount }} referencias</span>
      </button>
    </section>
  </div>

  <section class="pccs__adjustment" aria-labelledby="salary-adjustment-title">
    <header>
      <h2 id="salary-adjustment-title" i18n>Reajuste em Massa</h2>
    </header>
    <form [formGroup]="adjustmentForm" (ngSubmit)="applyAdjustment()" class="pccs__form">
      <label>
        <span i18n>Percentual</span>
        <input formControlName="percentual" />
      </label>
      <label>
        <span i18n>Vigencia inicial</span>
        <input type="date" formControlName="vigenciaInicio" />
      </label>
      <label>
        <span i18n>Lei referencia</span>
        <input formControlName="leiReferencia" />
      </label>
      <label>
        <span i18n>Faixa salarial</span>
        <input formControlName="salaryRangeId" />
      </label>
      <button mat-stroked-button color="primary" type="submit">
        <mat-icon>percent</mat-icon>
        <ng-container i18n>Aplicar</ng-container>
      </button>
    </form>

    <ol class="pccs__history" *ngIf="adjustment">
      <li *ngFor="let level of adjustment.affectedLevels">
        <span>{{ level.salaryRangeLevelId }}</span>
        <strong>{{ level.baseSalary }}</strong>
      </li>
    </ol>
  </section>
</section>
